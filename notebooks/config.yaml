# HEDIS Measure Ingest Configuration
# This configuration file centralizes all widget values for the notebooks.
# All notebooks load from this file on startup.

# Unity Catalog Settings
catalog_name: "marcin_demo2"
schema_name: "hedis_measurements"
volume_name: "hedis"

# File Processing
file_pattern: "HEDIS*.pdf"

# Vector Search Configuration
vector_search_endpoint: "hedis_vector_endpoint"
vector_index_name: "hedis_measures_index"
embedding_model: "databricks-bge-large-en"

# Chunking Configuration
chunk_size: "1024"
overlap_percent: "0.15"

# LLM Configuration
llm_endpoint: "databricks-claude-sonnet-4-5"

# Persistence Configuration
enable_persistence: "No"
lakebase_instance: "hedis-agent-pg"
create_lakebase: "No"

# Agent Configuration
effective_year: "2025"  # Auto-detected if empty

# Databricks Apps Deployment Configuration
backend_app_name: "hedis-chat-backend"
frontend_app_name: "hedis-chat-frontend"
agent_endpoint: "hedis_chat_agent"

# SQL Warehouse Configuration for Backend Delta Table Access
# The backend uses Databricks SQL Warehouse (via SDK) to query Delta tables - no PySpark needed
#
# How to find your SQL Warehouse ID:
#   1. Navigate to: SQL > SQL Warehouses in Databricks workspace
#   2. Click on your warehouse name
#   3. Go to "Connection Details" tab
#   4. Copy the warehouse ID from the Server hostname path: /sql/1.0/warehouses/<warehouse_id>
#
# Example: If Server hostname shows "/sql/1.0/warehouses/abc123def456", use "abc123def456"
#
# Note: Leave empty to use MOCK MODE (in-memory data, no real Delta tables)
sql_warehouse_id: "148ccb90800933a1"

# Note: Authentication is automatically handled by Databricks Apps built-in auth
# All users accessing the app are authenticated via workspace SSO
