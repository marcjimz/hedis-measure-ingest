# =============================================================================
# HEDIS Chat Application - Databricks Apps Deployment
# =============================================================================
#
# This application consists of TWO separate Databricks Apps:
#   1. Backend API (FastAPI) - Located in app/backend/app.yaml
#   2. Frontend UI (Next.js) - Located in app/frontend/app.yaml
#
# =============================================================================
# DEPLOYMENT INSTRUCTIONS
# =============================================================================
#
# STEP 1: Deploy the Backend App
# -------------------------------
# The backend must be deployed FIRST to get its URL.
#
# Using Databricks CLI:
#   cd app/backend
#   databricks apps deploy . --source-path app/backend
#
# Or programmatically with Python SDK:
#   from databricks.sdk import WorkspaceClient
#   w = WorkspaceClient()
#   app = w.apps.deploy(
#       source_code_path="app/backend",
#       manifest=yaml.safe_load(open("app/backend/app.yaml"))
#   )
#   backend_url = app.url
#   print(f"Backend URL: {backend_url}")
#
# STEP 2: Deploy the Frontend App with Backend URL
# -------------------------------------------------
# After deploying the backend, update the frontend's BACKEND_API_URL
# environment variable with the backend app's URL.
#
# Using Databricks CLI:
#   cd app/frontend
#   # Update app.yaml with backend URL or use --env flag
#   databricks apps deploy . --source-path app/frontend \
#     --env BACKEND_API_URL=https://your-workspace.cloud.databricks.com/apps/backend-app-id
#
# Or programmatically with Python SDK:
#   w.apps.deploy(
#       source_code_path="app/frontend",
#       manifest=yaml.safe_load(open("app/frontend/app.yaml")),
#       env_vars={"NEXT_PUBLIC_API_URL": backend_url}
#   )
#
# STEP 3: Access Your Application
# --------------------------------
# Navigate to the frontend app URL in your browser:
#   https://your-workspace.cloud.databricks.com/apps/frontend-app-id
#
# The frontend will proxy all /api/* requests to the backend.
#
# =============================================================================
# ARCHITECTURE
# =============================================================================
#
# Frontend (Next.js) → /api/* requests → Backend (FastAPI)
#
# - Frontend runs on its own Databricks App instance
# - Backend runs on a separate Databricks App instance
# - Next.js rewrites proxy API calls to the backend
# - Both apps can scale independently
#
# =============================================================================
# TROUBLESHOOTING
# =============================================================================
#
# Issue: Frontend can't reach backend
# Solution: Verify NEXT_PUBLIC_API_URL is set correctly in frontend app.yaml
#           Check CORS settings in backend/main.py allow frontend origin
#
# Issue: 404 errors on API calls
# Solution: Check Next.js rewrites in frontend/next.config.mjs
#           Verify backend is deployed and accessible
#
# Issue: Build errors
# Solution: Ensure dependencies are installed
#           Frontend: npm install in frontend/
#           Backend: pip install -r backend/requirements.txt
#
# =============================================================================

# This root-level app.yaml file is for documentation purposes only.
# Actual deployments use:
#   - app/backend/app.yaml (Backend API)
#   - app/frontend/app.yaml (Frontend UI)
